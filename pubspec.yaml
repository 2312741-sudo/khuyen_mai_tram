name: khuyen_mai_tram
description: Ứng dụng quản lý khuyến mãi và tích điểm khách hàng cho hệ sinh thái Trạm
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  # State Management & Routing
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.3.0
  # Excel Processing
  excel: ^4.0.6
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  file_picker: ^8.0.0+1
  # UI
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  intl: any
  equatable: ^2.0.5
  uuid: ^4.4.2
  universal_html: ^2.2.4
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
